<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>繋ぐノート A5横チラシ</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  @page { size: 210mm 148mm; margin: 0; }
  :root {
    --navy: #1b3f7a;
    --blue: #2f73c4;
    --red: #d8424f;
    --green: #7cb342;
    --ink: #2b2f3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans JP", sans-serif; color: var(--ink); background: #fff;
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .sheet {
    width: 210mm; height: 148mm; margin: 0 auto; overflow: hidden; position: relative;
    background:
      radial-gradient(ellipse 90mm 70mm at 0 100%, #dcebf8 0%, transparent 70%),
      linear-gradient(180deg, #ffffff 0%, #f0f6fc 100%);
    display: grid; grid-template-columns: 122mm 1fr; grid-template-rows: minmax(0, 1fr) 13mm;
    column-gap: 6mm; row-gap: 3mm;
    padding: 6mm 8mm 5mm 8mm;
  }
  .leaves { position: absolute; left: 0; top: 0; width: 34mm; mix-blend-mode: multiply; opacity: .9; pointer-events: none;
            -webkit-mask-image: radial-gradient(ellipse 100% 100% at 0 0, #000 45%, transparent 100%);
                    mask-image: radial-gradient(ellipse 100% 100% at 0 0, #000 45%, transparent 100%); }

  /* ---------- 左カラム ---------- */
  .left { display: flex; flex-direction: column; min-height: 0; position: relative; }
  .title { display: flex; align-items: center; justify-content: center; gap: 3mm;
           font-family: "Shippori Mincho", serif; color: var(--navy); }
  .title .logo { width: 17mm; mix-blend-mode: multiply; filter: brightness(1.12) contrast(1.25); }
  .title .pre { font-size: 12pt; font-weight: 700; letter-spacing: .14em; }
  .title h1 { font-size: 26pt; font-weight: 800; line-height: 1.2; letter-spacing: .04em; }
  .title rt { font-size: 6pt; font-weight: 500; letter-spacing: .3em; }

  .pillars { display: grid; grid-template-columns: repeat(3, 1fr); gap: 3mm; margin-top: 2mm; }
  .pillar { text-align: center; --line: var(--red); }
  .pillar:nth-child(2) { --line: var(--green); }
  .pillar:nth-child(3) { --line: var(--blue); }
  .pillar h2 { font-family: "Shippori Mincho", serif; font-size: 13pt; font-weight: 700; color: var(--navy); }
  .pillar h2 b { font-size: 18pt; font-weight: 800; }
  .pillar h2::after { content: ""; display: block; height: .6mm; margin: .8mm auto 0; width: 85%; border-radius: 1mm;
                      background: linear-gradient(90deg, transparent, var(--line) 20%, var(--line) 80%, transparent); }
  .pillar p { font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 7.5pt; line-height: 1.6; margin-top: 1mm; }

  .acp { text-align: center; margin-top: 2.5mm; font-family: "Shippori Mincho", serif; color: var(--navy); }
  .acp .sub { font-size: 10pt; font-weight: 700; letter-spacing: .08em; }
  .acp .main { font-size: 13pt; font-weight: 800; letter-spacing: .04em; }
  .acp .main em { font-style: normal; font-size: 17pt; }

  .mock { flex: 1; min-height: 0; margin-top: 1.5mm; display: flex; justify-content: center; }
  .mock img { height: 100%; max-width: 100%; object-fit: contain; display: block;
              -webkit-mask-image: linear-gradient(90deg, transparent, #000 8%), linear-gradient(0deg, transparent, #000 10%);
              -webkit-mask-composite: source-in;
                      mask-image: linear-gradient(90deg, transparent, #000 8%), linear-gradient(0deg, transparent, #000 10%);
                      mask-composite: intersect; }

  /* ---------- 右カラム ---------- */
  .right { display: flex; flex-direction: column; gap: 3mm; min-height: 0; }
  .photos { display: grid; grid-template-columns: 1fr 1fr; grid-auto-rows: 21.5mm; gap: 1.2mm; }
  .photos img { width: 100%; height: 100%; object-fit: cover; object-position: center 30%; border-radius: 1.2mm; display: block; }
  .desc {
    flex: 1; background: #fff; border-left: 1.2mm solid var(--navy); border-radius: 1.5mm;
    padding: 3mm 4mm; font-size: 8.4pt; line-height: 1.8; text-align: justify;
    box-shadow: 0 .4mm 1.5mm rgba(27,63,122,.12);
    display: flex; flex-direction: column; justify-content: center;
  }
  .desc strong { color: var(--navy); }
  .desc h3 { font-family: "Shippori Mincho", serif; font-size: 10.5pt; color: var(--navy); margin-bottom: 1.5mm; letter-spacing: .06em; }
  .desc h3::after { content: ""; display: block; width: 12mm; height: .5mm; background: var(--red); margin-top: .8mm; }

  /* ---------- 下帯 ---------- */
  .band {
    grid-column: 1 / 3; border-radius: 6.5mm; background: #fff;
    border: .8mm solid var(--navy); box-shadow: 0 0 0 1.2mm #dbe7f5;
    display: flex; align-items: center; justify-content: center; gap: 4mm;
    font-family: "Shippori Mincho", serif; font-weight: 800; color: var(--navy);
    font-size: 11.5pt; letter-spacing: .08em;
  }
  .band svg { width: 16mm; height: 7mm; flex: none; }
</style>
</head>
<body>
<div class="sheet">
  <img class="leaves" src="img/leaves.jpg" alt="">

  <section class="left">
    <div class="title">
      <img class="logo" src="img/logo.jpg" alt="">
      <div>
        <div class="pre">生きるための</div>
        <h1>『<ruby>繋<rt>つな</rt></ruby>ぐノート』</h1>
      </div>
    </div>

    <div class="pillars">
      <div class="pillar">
        <h2><b>命</b>を繋ぐ</h2>
        <p>もしもの時に備え、<br>自分の想いや希望を<br>整理できます</p>
      </div>
      <div class="pillar">
        <h2><b>誰</b>かに繋ぐ</h2>
        <p>家族や大切な人と、<br>対話するきっかけに<br>なります</p>
      </div>
      <div class="pillar">
        <h2><b>未</b>来に繋ぐ</h2>
        <p>これからの人生を、<br>自分らしく前向きに<br>考える一歩に</p>
      </div>
    </div>

    <div class="acp">
      <div class="sub">生きる準備を整えるための</div>
      <div class="main"><em>人生会議</em>（ACP）を始めるためのノート</div>
    </div>

    <div class="mock">
      <img src="img/notebook.jpg" alt="繋ぐノートの表紙と中面">
    </div>
  </section>

  <section class="right">
    <div class="photos">
      <img src="img/photo1.jpg" alt="">
      <img src="img/photo2.jpg" alt="">
      <img src="img/photo3.jpg" alt="">
      <img src="img/photo4.jpg" alt="">
      <img src="img/photo5.jpg" alt="">
      <img src="img/photo6.jpg" alt="">
    </div>
    <div class="desc">
      <h3>繋ぐノートとは</h3>
      <p><strong>大切にしていること、家族への想い、緊急時に医療従事者への連携や介護への希望</strong>、そして希望する終末期医療の具体化や、旅立ちまで、自分の人生を一つにつなげて考え、<strong>家族と話し合うためのツール</strong>です。</p>
    </div>
  </section>

  <div class="band">
    <span>繋ぐノートは、あなたの想いを、あなたの未来を、大切な人に“繋ぐ”ノートです。</span>
    <svg viewBox="0 0 64 28" fill="none" stroke="#d8424f" stroke-width="1.4" stroke-linecap="round">
      <path d="M2 22 C 14 26, 22 18, 30 14 C 26 8, 32 3, 36 8 C 40 3, 46 8, 40 14 L 36 19 L 32 14 C 40 20, 52 24, 62 20"/>
    </svg>
  </div>
</div>
</body>
</html>
