<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<title>繋ぐノート A5横チラシ 表面</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;500;700&family=Shippori+Mincho:wght@500;700;800&display=swap" rel="stylesheet">
<style>
  @page { size: 216mm 154mm; margin: 0; } /* A5横 210×148mm + 塗り足し3mm */
  :root {
    --navy: #1b3f7a;
    --blue: #2f73c4;
    --red: #d8424f;
    --gold: #d9b25f;
    --ink: #2b2f3a;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: "Noto Sans JP", sans-serif; color: var(--ink); background: #fff;
         -webkit-print-color-adjust: exact; print-color-adjust: exact; }

  .sheet {
    width: 216mm; height: 154mm; margin: 0 auto; overflow: hidden; position: relative;
    background:
      radial-gradient(ellipse 110mm 80mm at 100% 100%, #dcebf8 0%, transparent 70%),
      linear-gradient(180deg, #ffffff 0%, #f0f6fc 100%);
    display: grid; grid-template-columns: 84mm 1fr;
  }

  /* ---------- 写真スペース（印刷所にて配置） ---------- */
  .photo {
    position: relative;
    background: linear-gradient(160deg, #e3ecf6 0%, #c9d9ec 100%);
    display: flex; align-items: center; justify-content: center;
  }
  .photo::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 1.2mm;
                  background: linear-gradient(180deg, transparent, var(--gold) 15%, #f3dca0 50%, var(--gold) 85%, transparent); }
  .photo .guide {
    width: 62mm; height: 110mm; border: .4mm dashed #7f9cc2; border-radius: 2mm;
    display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2mm;
    color: #5a7aa6; font-size: 9pt; font-weight: 700; text-align: center; line-height: 1.6;
  }
  .photo .guide small { font-size: 7pt; font-weight: 500; }

  /* ---------- プロフィール ---------- */
  .profile { position: relative; padding: 10mm 14mm 22mm 12mm; display: flex; flex-direction: column; justify-content: center; }
  .leaves { position: absolute; right: 0; top: 0; width: 34mm; transform: scaleX(-1); mix-blend-mode: multiply; opacity: .85;
            -webkit-mask-image: radial-gradient(ellipse 100% 100% at 0 0, #000 45%, transparent 100%);
                    mask-image: radial-gradient(ellipse 100% 100% at 0 0, #000 45%, transparent 100%); }

  .label { font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 10pt; letter-spacing: .3em; color: var(--navy);
           display: flex; align-items: center; gap: 3mm; }
  .label::after { content: ""; width: 18mm; height: .5mm; background: var(--red); }

  .name { margin-top: 6mm; font-family: "Shippori Mincho", serif; color: var(--navy); display: flex; align-items: baseline; gap: 4mm; }
  .name h1 { font-size: 34pt; font-weight: 800; letter-spacing: .06em; line-height: 1; }
  .name span { font-size: 9.5pt; font-weight: 700; letter-spacing: .12em; }

  .titles { margin-top: 5mm; font-size: 8.8pt; line-height: 1.75; font-weight: 500; }
  .titles li { list-style: none; padding-left: 3.5mm; position: relative; }
  .titles li::before { content: ""; position: absolute; left: 0; top: .72em; width: 1.4mm; height: 1.4mm; border-radius: 50%; background: var(--blue); }
  .titles b { font-weight: 700; color: var(--navy); }

  .intro {
    margin-top: 7mm; padding: 4.5mm 5.5mm; background: #fff; border-radius: 2mm;
    border-left: 1.2mm solid var(--navy); box-shadow: 0 .4mm 1.5mm rgba(27,63,122,.12);
    font-family: "Shippori Mincho", serif; font-weight: 700; font-size: 11.5pt; line-height: 1.95; letter-spacing: .04em;
    white-space: nowrap;
  }
  .intro em { font-style: normal; color: var(--navy); }

  .brand { position: absolute; left: 12mm; bottom: 11mm; display: flex; align-items: center; gap: 3mm; font-family: "Shippori Mincho", serif;
           color: var(--navy); font-weight: 700; font-size: 9pt; letter-spacing: .1em; }
  .brand img { width: 13mm; mix-blend-mode: multiply; filter: brightness(1.12) contrast(1.25); }
</style>
</head>
<body>
<div class="sheet">
  <div class="photo">
    <div class="guide">講師写真<small>（印刷所にて配置）<br>塗り足し3mmを含めて<br>この枠全体に配置してください</small></div>
  </div>

  <section class="profile">
    <img class="leaves" src="img/leaves.jpg" alt="">
    <div class="label">講師プロフィール</div>

    <div class="name">
      <h1>松本&#8197;恵</h1>
      <span>まつもと・めぐみ</span>
    </div>

    <ul class="titles">
      <li>株式会社繋ぐコンサルタントオフィス　<b>代表取締役</b></li>
      <li>一般社団法人繋ぐライクファミリーサポート　<b>代表理事</b></li>
      <li>全国専門家ネットワーク「繋ぐ相続サロン®」<b>創設者・主宰</b></li>
    </ul>

    <p class="intro">
      大手金融機関で約20年、資産承継に携わる。<br>
      財産ではなく<em>人生に寄り添う相続</em>を提唱し、<br>
      全国50拠点の<em>「繋ぐグループ」</em>を主宰。<br>
      ACPを推進する<em>「繋ぐノート®」</em>を制作。
    </p>

    <div class="brand">
      <img src="img/logo.jpg" alt="">
      <span>生きるための『繋ぐノート®』</span>
    </div>
  </section>
</div>
</body>
</html>
